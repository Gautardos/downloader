[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1
autostart=true
autorestart=true
priority=1
stdout_logfile=/var/log/redis.log
stderr_logfile=/var/log/redis_error.log

[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/apache2.log
stderr_logfile=/var/log/apache2_error.log

[program:worker]
command=php bin/console app:download-worker
directory=/var/www/html
user=www-data
environment=HOME="/var/www/html/var/home",USER="www-data"
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/null
stderr_logfile=/var/www/html/var/storage/logs/worker_error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=5

[program:automation-worker]
command=php bin/console app:automation-worker
directory=/var/www/html
user=www-data
environment=HOME="/var/www/html/var/home",USER="www-data"
autostart=true
autorestart=true
priority=6
stdout_logfile=/dev/null
stderr_logfile=/var/www/html/var/storage/logs/automation_worker_error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=5

[program:music-automations-worker]
command=php bin/console app:music-automations --loop
directory=/var/www/html
user=www-data
environment=HOME="/var/www/html/var/home",USER="www-data"
autostart=true
autorestart=true
priority=8
stdout_logfile=/dev/null
stderr_logfile=/var/www/html/var/storage/logs/music_automations_worker_error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=5

[program:maintenance-worker]
command=php bin/console app:maintenance --loop
directory=/var/www/html
user=www-data
environment=HOME="/var/www/html/var/home",USER="www-data"
autostart=true
autorestart=true
priority=7
stdout_logfile=/dev/null
stderr_logfile=/var/www/html/var/storage/logs/maintenance_error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=5
